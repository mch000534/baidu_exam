function gradeAnswer(answer, selected) {
  if (!Array.isArray(selected) || !selected.length) return false;
  const expected = [...new Set(String(answer).toUpperCase().split(''))].sort();
  const actual = [...new Set(selected.map(x => String(x).toUpperCase()))].sort();
  return expected.length === actual.length && expected.every((v, i) => v === actual[i]);
}

}

}

 const seconds=Math.floor(milliseconds/1000), hours=Math.floor(seconds/3600), minutes=Math.floor((seconds%3600)/60), remainder=seconds%60;
 return hours?`${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(remainder).padStart(2,'0')}`:`${String(minutes).padStart(2,'0')}:${String(remainder).padStart(2,'0')}`;
}
function timerStatus(){return timer.startedAt===null?'已暫停':'計時中';}
function refreshTimer(){
 const time=document.querySelector('#lesson-timer'),status=document.querySelector('#timer-status'),toggle=document.querySelector('#timer-toggle');
 if(time)time.textContent=formatTime(elapsedTime());
 if(status)status.textContent=timerStatus();
 if(toggle)toggle.textContent=timer.manuallyPaused?'繼續':'暫停';
}
function saveTimer(){
 if(!timer.id)return;
 lessonTimes[timer.id]={elapsedMs:elapsedTime(),manuallyPaused:timer.manuallyPaused};
 try{localStorage.setItem(lessonTimerKey,JSON.stringify(lessonTimes));}catch{/* Timer still works for the current session. */}
}
function pauseTimer(){
 if(timer.startedAt!==null)timer.elapsedMs=elapsedTime();
 timer.startedAt=null;saveTimer();refreshTimer();
}
function resumeTimer(){
 if(timer.id&&!timer.manuallyPaused&&timer.startedAt===null&&!document.hidden&&(state.view==='quiz'||state.view==='practical'))timer.startedAt=Date.now();
 refreshTimer();
}
function selectLessonTimer(id){
 if(timer.id!==id){
   pauseTimer();
   const saved=id?lessonTimes[id]:null;
   const elapsed=typeof saved?.elapsedMs==='number'&&Number.isFinite(saved.elapsedMs)&&saved.elapsedMs>=0?saved.elapsedMs:0;
   timer={id,elapsedMs:elapsed,startedAt:null,manuallyPaused:saved?.manuallyPaused===true};
 }
 resumeTimer();
}
let lastTimerSave=0;
setInterval(()=>{refreshTimer();if(timer.startedAt!==null&&Date.now()-lastTimerSave>=5000){saveTimer();lastTimerSave=Date.now();}},1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseTimer();else resumeTimer();});
window.addEventListener('pagehide',pauseTimer);
window.addEventListener('pageshow',resumeTimer);

async function copyPractical(){
 const q=practicalQuestions[state.practicalIndex];if(!q)return;
 const text=practicalCopyText(q),status=document.querySelector('#practical-copy-status'),manual=document.querySelector('#practical-copy-manual'),input=document.querySelector('#practical-copy-text');
 let copied=false;
 if(typeof navigator!=='undefined' && navigator.clipboard?.writeText){
   try{await navigator.clipboard.writeText(text);copied=true;}catch{/* Try the local-file fallback. */}
 }
 if(!copied && input && manual){
   manual.hidden=false;input.value=text;
   try{input.focus();input.select();input.setSelectionRange(0,input.value.length);copied=typeof document.execCommand==='function'&&document.execCommand('copy');}catch{/* Leave the text available for manual copying. */}
 }
 if(copied){
   if(manual){const wasVisible=!manual.hidden;manual.hidden=true;if(wasVisible)document.querySelector('[data-action="copy-practical"]')?.focus({preventScroll:true});}
   if(status)status.textContent='已複製公式和題目，可以貼到 AI 工具。';
 }else{
   if(manual)manual.hidden=false;
   if(input){input.value=text;try{input.focus();input.select();}catch{/* Text remains visible for manual selection. */}}
   if(status)status.textContent='未能自動複製，請選取下方文字後自行複製。';
 }
}

 <div class="practical-copy"><button class="btn" data-action="copy-practical">一鍵複製超能公式及題目</button><p>複製後貼到 AI 工具，請它幫你優化提示詞。</p><span id="practical-copy-status" role="status" aria-live="polite"></span><div id="practical-copy-manual" class="practical-copy-manual" hidden><label for="practical-copy-text">公式與完整題目</label><textarea id="practical-copy-text" rows="10" readonly>${e(practicalCopyText(q))}</textarea></div></div>
 <section class="practical-tip"><div class="eyebrow">白話拆解</div><h3>這題要你做甚麼？</h3><p>${e(q.tip)}</p><ul>${q.checks.map(c=>`<li>${e(c)}</li>`).join('')}</ul></section>
 <section class="practical-writing"><h3>輪到你動手</h3><p>本頁不會自動連接 AI。你可以把提示詞複製到你使用的 AI 工具，再把結果或筆記貼回來。</p><label for="practical-prompt" class="prompt-label">我的提示詞 <span id="practical-prompt-count" class="prompt-count" aria-live="off" title="包括空格、標點及換行">${promptCountLabel(q,response.prompt||'')}</span></label><textarea id="practical-prompt" data-practical-field="prompt" rows="6" placeholder="試著寫下你的提示詞…">${e(response.prompt||'')}</textarea><p class="prompt-count-help">字數包括空格、標點及換行。</p><label for="practical-output">AI 輸出或我的筆記 <span>（選填）</span></label><textarea id="practical-output" data-practical-field="output" rows="5" placeholder="可貼上 AI 的回應、圖片描述或自己的檢查筆記…">${e(response.output||'')}</textarea><p class="practical-save">內容會保存在這部裝置的瀏覽器中；不同裝置不會自動同步。</p></section>
 <details class="practical-reference"><summary>查看文件的參考答案</summary><div class="source-text">${e(q.reference)}</div><p>這是一個參考做法；你的答案可以不同，記得對照題目要求自行檢查。</p></details>
 <div class="quiz-actions"><button class="btn btn-white" data-action="practical-prev" ${state.practicalIndex===0?'disabled':''}>← 上一題</button><button class="btn" data-action="practical-next" ${state.practicalIndex===practicalQuestions.length-1?'disabled':''}>下一題 →</button><button class="btn btn-white reset-lesson-btn" data-action="reset-practical">重置所有實操題及計時</button></div></section>
 <footer class="page-footer"><div>需要圖片或影片的題目，請使用合適的外部工具完成。</div></footer>`;
}
function render(){
 const p=getProgress(questions,history);
 const progress=state.view==='practical'?`已寫 ${practicalCount()} / ${practicalQuestions.length} 題`:`已練習 ${p.answered} / ${p.total} 題`;
 root.innerHTML=`<div class="shell">${sidebar()}<div class="main-wrap"><header class="topbar"><div class="breadcrumbs">AI 慢慢學　/　<b>${e(currentLabel())}</b></div><div class="top-right"><span class="progress-dot" aria-hidden="true"></span><span id="header-progress">${progress}</span></div></header><main id="main" class="content">${state.view==='home'?home():state.view==='lesson'?lesson():state.view==='practical'?practical():quiz()}</main></div>${mobileNav()}</div>`;
}
function goTop(){window.scrollTo({top:0,behavior:'auto'});}
function showQuestion(force=false){
 const panel=document.querySelector('.quiz-panel');
 if(!panel)return;
 const heading=document.querySelector('.question-title');
 if(force){panel.scrollIntoView({behavior:'auto',block:'start'});return;}
 if(!heading)return;
 const bounds=heading.getBoundingClientRect();
 if(bounds.top<0 || bounds.bottom>window.innerHeight-72)panel.scrollIntoView({behavior:'auto',block:'start'});
}
function resetLesson(moduleId){
 const lesson=modules.find(m=>m.id===moduleId);
 if(!lesson || !window.confirm(`確定重置「${lesson.short}」的所有作答紀錄和計時？此操作無法復原。`))return;
 for(const question of questions)if(question.module===moduleId)delete history[question.id];
 persistHistory();
 lessonTimes[moduleId]={elapsedMs:0,manuallyPaused:false};
 if(timer.id===moduleId)timer={id:moduleId,elapsedMs:0,startedAt:null,manuallyPaused:false};
 try{localStorage.setItem(lessonTimerKey,JSON.stringify(lessonTimes));}catch{/* Current-session reset still applies. */}
 state.notice=`已重置「${lesson.short}」的全部題目和計時。`;
 if(state.view==='quiz'){
   state.filter=moduleId;state.search='';state.wrongOnly=false;state.wrongIds=new Set();state.index=0;
   loadQuestionState();render();showQuestion();
 }else render();
}
function resetPractical(){
 if(!window.confirm('確定重置所有實操題的草稿、筆記和計時？此操作無法復原。'))return;
 practicalResponses={};persistPractical();
 lessonTimes.practical={elapsedMs:0,manuallyPaused:false};
 if(timer.id==='practical')timer={id:'practical',elapsedMs:0,startedAt:null,manuallyPaused:false};
 try{localStorage.setItem(lessonTimerKey,JSON.stringify(lessonTimes));}catch{/* Current-session reset still applies. */}
 state.practicalIndex=0;state.notice='已重置所有實操題草稿、筆記和計時。';resumeTimer();render();showQuestion();
}
function navigate(view, opts={}){
 state.notice='';
 if(state.view==='quiz'||state.view==='practical')pauseTimer();
 state.view=view;
 if(opts.module)state.module=opts.module;
 if(view==='quiz') { state.filter=opts.filter||'all';state.search='';state.wrongOnly=false;state.wrongIds=new Set();state.index=0;loadQuestionState(); }
 if(view==='practical')selectLessonTimer('practical');
 render();goTop();
}
root.addEventListener('click', ev=>{
 const el=ev.target.closest('[data-action]'); if(!el)return;
 if(el.tagName==='A')ev.preventDefault();
 const action=el.dataset.action;
 if(action!=='reset-lesson'&&action!=='reset-practical')state.notice='';
 if(action==='reset-lesson')resetLesson(el.dataset.module);
 if(action==='reset-practical')resetPractical();
 if(action==='home')navigate('home');
 if(action==='lesson')navigate('lesson',{module:el.dataset.module});
 if(action==='practice')navigate('quiz',{filter:el.dataset.filter});
 if(action==='practical')navigate('practical');
 if(action==='copy-superformula')copySuperFormula();
 if(action==='copy-practical')copyPractical();
 if(action==='practical-prev'||action==='practical-next'){state.practicalIndex=Math.max(0,Math.min(practicalQuestions.length-1,state.practicalIndex+(action==='practical-next'?1:-1)));render();showQuestion();}
 if(action==='show-filters')document.querySelector('.filter-card')?.scrollIntoView({behavior:'auto',block:'start'});
 if(action==='show-question')showQuestion(true);
 if(action==='submit'){
   const q=currentQuestion(); if(!q||!state.selected.length)return;
   state.submitted=true;history[q.id]={selected:[...state.selected],correct:gradeAnswer(q.a,state.selected)};persistHistory();saveTimer();render();
 }
 if(action==='retry'){
   if(!currentQuestion())return;
   state.selected=[];state.submitted=false;render();
 }
 if(action==='timer-toggle'){
   timer.manuallyPaused=!timer.manuallyPaused;
   if(timer.manuallyPaused)pauseTimer();else{resumeTimer();saveTimer();}
 }
 if(action==='timer-reset'){
   timer.elapsedMs=0;if(timer.startedAt!==null)timer.startedAt=Date.now();saveTimer();refreshTimer();
 }
 if(action==='prev'||action==='next'){
   const len=filtered().length;state.index=Math.max(0,Math.min(len-1,state.index+(action==='next'?1:-1)));loadQuestionState();render();showQuestion();
 }
});
root.addEventListener('change', ev=>{
 state.notice='';
 const el=ev.target;
 if(el.name==='answer'){
   const q=currentQuestion(); if(!q||state.submitted)return;
   if(q.t==='s')state.selected=[el.value];
   else state.selected=el.checked?[...state.selected,el.value]:state.selected.filter(x=>x!==el.value);
   render();
   document.querySelector(`input[name="answer"][value="${el.value}"]`)?.focus();
 } else if(el.id==='practical-picker'){
   const value=Number(el.value);if(Number.isInteger(value)&&value>=0&&value<practicalQuestions.length){state.practicalIndex=value;render();showQuestion();}
 } else if(el.id==='topic-filter'){
   state.filter=el.value;state.index=0;loadQuestionState();render();document.querySelector('#topic-filter')?.focus();
 } else if(el.id==='wrong-only'){
   state.wrongOnly=el.checked;state.wrongIds=new Set(Object.keys(history).filter(id=>history[id] && history[id].correct===false));state.index=0;loadQuestionState();render();document.querySelector('#wrong-only')?.focus();
 }
});
function updateSearch(input){
 state.notice='';
 const pos=input.selectionStart;state.search=input.value;state.index=0;loadQuestionState();render();
 const replacement=document.querySelector('#search');replacement?.focus();if(replacement&&pos!==null)replacement.setSelectionRange(pos,pos);
}
root.addEventListener('compositionend',ev=>{ if(ev.target.id==='search')updateSearch(ev.target); });
root.addEventListener('input',ev=>{
 const field=ev.target.dataset?.practicalField;
 if(state.view==='practical'&&(field==='prompt'||field==='output')){
   const q=practicalQuestions[state.practicalIndex];
   practicalResponses[q.id]={...(practicalResponses[q.id]||{}),[field]:ev.target.value};persistPractical();
   if(field==='prompt'){const counter=document.querySelector('#practical-prompt-count');if(counter)counter.textContent=promptCountLabel(q,ev.target.value);}
   const progress=document.querySelector('#practical-progress'), header=document.querySelector('#header-progress');
   if(progress)progress.textContent=`已寫提示詞 ${practicalCount()} / ${practicalQuestions.length} 題`;
   if(header)header.textContent=`已寫 ${practicalCount()} / ${practicalQuestions.length} 題`;
   return;
 }
 if(ev.target.id==='search'&&!ev.isComposing)updateSearch(ev.target);
});
render();
</script>
</body>
</html>
